name: Release Gate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    # Only release-please PRs exist on this repo, but guard anyway.
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
      - name: Agent skill verified since last behavior change?
        run: |
          set -euo pipefail
          sha=$(grep -oE '^verified-at: [0-9a-f]{40}' \
                .claude/skills/lessence/references/sources.md | awk '{print $2}')
          if [ -z "${sha:-}" ]; then
            echo "::error::sources.md has no 'verified-at: <sha>' line"; exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::verified-at sha $sha is not an ancestor of main"; exit 1
          fi
          unverified=$(git log "$sha"..HEAD --extended-regexp \
            --grep='^(feat|fix|perf)(\(.*\))?!?:' --format='%h %s' -- src/)
          if [ -n "$unverified" ]; then
            echo "$unverified"
            echo "::error file=.claude/skills/lessence/references/sources.md::Agent skill not re-verified since the behavior change(s) above. FIX: cargo build --release, re-verify each sources.md claim against the binary, update 'Last verified' dates AND set 'verified-at:' to the current main sha, commit to MAIN as 'docs: re-verify agent skill for vX.Y.Z', then re-run this check: gh run rerun ${GITHUB_RUN_ID} --failed (or 'Re-run jobs' in the UI) — the job checks out current main, so the rerun will pass. A docs-only commit does NOT refresh the release PR, so the check will NOT re-trigger on its own; do NOT edit the PR branch and do NOT use 'gh pr merge --admin'."
            exit 1
          fi
          echo "skill verified-at $sha covers all user-facing src/ commits — ok"
