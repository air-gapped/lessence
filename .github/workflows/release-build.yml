name: Release Build

permissions:
  contents: write
  id-token: write

on:
  release:
    # `released` fires when a release is published (a draft promoted to live, or
    # created already-published). Both jobs key off it: publish-crate runs
    # `cargo publish`, build-binaries compiles + attaches the per-target binaries.
    # NOTE: we do NOT use `created` — release-please's bot-created drafts do not
    # emit a `created` workflow event, so binaries must be built at publish time.
    types: [released]
  # Manual recovery: rebuild + reattach binaries for an existing tag (e.g. a
  # release that published without them).
  #   gh workflow run release-build.yml -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build + attach binaries for (e.g. v0.4.3)
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish-crate:
    # Only run when the release is actually published, not on draft creation.
    # crates.io publishes are immutable; we never want to fire this for a
    # draft that might be deleted.
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # Full history: the ancestry guard below needs the main branch graph.
          fetch-depth: 0

      # crates.io publishes are immutable — including the README frozen at the
      # tag. Only commits that went through the gated release-PR merge (and
      # therefore passed the doc-contract tests and the release-gate check)
      # may publish. A tag pushed from a side branch must never reach
      # crates.io.
      - name: Refuse to publish a tag that is not on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag commit $(git rev-parse HEAD) is not an ancestor of origin/main — it never passed the release merge gate. Refusing to publish to crates.io."
            exit 1
          fi
          echo "tag commit is on main — ok"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      # Defense in depth: re-run the doc-contract suite at the exact tag being
      # published, so shipped doc surfaces provably match the binary that
      # crates.io will freeze forever.
      - name: Doc contract at the tag
        run: cargo test --release --test doc_contract

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  build-binaries:
    # Build + attach the per-target binaries when the release is published, or
    # on a manual workflow_dispatch recovery run for a given tag.
    if: github.event.action == 'released' || github.event_name == 'workflow_dispatch'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Native Intel runner (standard tier, free for public repos) so the
          # x86_64 binary is built AND executed on its real architecture —
          # macos-latest is arm64 and Rosetta is being sunset after macOS 26.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # mimalloc has C source that needs a musl-targeted C compiler when
      # building for x86_64-unknown-linux-musl. ubuntu-latest doesn't ship
      # musl-tools by default; install it before the upload action runs
      # `cargo build`. No untrusted input is interpolated — `matrix.target`
      # is a static config value, and the run: command is a literal.
      - name: Install musl cross-compile toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # ---- Smoke tests (ripgrep-style): build the exact release target first,
      # execute it, and only then let the upload action rebuild from the warm
      # cache and attach the asset. A binary that does not start or does not
      # fold never reaches the release page. Only `matrix.target` (a static
      # config value) is interpolated into run: commands.
      - name: Build for smoke test
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      # aarch64 is cross-compiled; the upload action uses cross (docker) for
      # it, so build with the same tool the action will reuse.
      - name: Build for smoke test (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          type -P cross >/dev/null || cargo install cross --locked
          cross build --release --target ${{ matrix.target }}

      # The fixture asserts both halves of the contract: repeated lines fold
      # (the "similar" marker) and the unique line survives (zero data loss).
      - name: Smoke test
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/lessence"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" --completions bash > /dev/null
          out=$(printf 'ERROR connect timeout host=10.0.0.1\nERROR connect timeout host=10.0.0.2\nERROR connect timeout host=10.0.0.3\nERROR connect timeout host=10.0.0.4\nINFO unique startup line\n' | "$BIN" -q)
          grep -F "similar" <<<"$out"
          grep -F "INFO unique startup line" <<<"$out"

      # Cross-compiled target: execute under qemu inside the same cross-rs
      # image that built it (ripgrep's release pipeline does the same).
      - name: Smoke test (qemu, aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          BIN=/target/aarch64-unknown-linux-gnu/release/lessence
          IMG=ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main
          docker run --rm -v "$PWD/target:/target:Z" "$IMG" qemu-aarch64 "$BIN" --version
          out=$(printf 'ERROR connect timeout host=10.0.0.1\nERROR connect timeout host=10.0.0.2\nERROR connect timeout host=10.0.0.3\nERROR connect timeout host=10.0.0.4\nINFO unique startup line\n' | docker run --rm -i -v "$PWD/target:/target:Z" "$IMG" qemu-aarch64 "$BIN" -q)
          grep -F "similar" <<<"$out"
          grep -F "INFO unique startup line" <<<"$out"

      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lessence
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
