name: Release

# Manual only: nothing here runs on push. Two ways to start it:
#
#   gh workflow run release-build.yml --ref main
#     Dry run (the default). Every target is tested, built, smoke-tested and
#     packaged; nothing is tagged, uploaded or published.
#
#   gh workflow run release-build.yml --ref main -f tag=vX.Y.Z
#     Release. The same jobs, then — only if every one of them passed — the
#     tag and the GitHub release are created at the tested commit, and only
#     after that is the crate published.
#
# The order is the point. 0.8.0 was released first and built second: its
# crate reached crates.io while macOS was failing to compile. Here the tag,
# the release and the crate all come after the whole matrix is green, as in
# astral-sh/uv's and ruff's release workflows.
#
# The file keeps its old name: crates.io trusted publishing is bound to it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "vX.Y.Z to release, or dry-run to test and build every target and publish nothing"
        required: true
        default: dry-run

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publishing: ${{ steps.plan.outputs.publishing }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release is cut from main only, at the commit this run tests.
      - name: Plan
        id: plan
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::run this workflow on main (--ref main), not $REF"
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = dry-run ]; then
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            echo "dry run of $version at $GITHUB_SHA: nothing will be published"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z or dry-run, got $TAG"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; a release never moves a tag"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [$version] section for the release notes"
            exit 1
          fi
          echo "publishing=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # build.rs embeds this in `--version`. The cross-rs container that builds
    # aarch64 has no git, so it is passed in explicitly.
    env:
      LESSENCE_BUILD_ID: ${{ github.sha }}
      CROSS_CONTAINER_OPTS: --env LESSENCE_BUILD_ID=${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Native Intel runner so the x86_64 binary is tested on its real
          # architecture; macos-latest is arm64.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      # mimalloc has C source that needs a musl-targeted C compiler.
      - name: Install musl cross-compile toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cargo-nextest
        if: ${{ !matrix.cross }}
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-nextest

      # The integration tests spawn the lessence binary itself. Inside the
      # cross container that is an aarch64 executable the x86 host kernel
      # cannot run until qemu is registered with binfmt_misc; cross only
      # wraps the test harness, not what the harness starts.
      - name: Register qemu for aarch64 executables
        if: ${{ matrix.cross }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Install cross
        if: ${{ matrix.cross }}
        run: type -P cross >/dev/null || cargo install cross --locked

      # The whole test suite on the platform it ships to: natively, or under
      # qemu inside the cross-rs image for aarch64.
      - name: Test
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo nextest run --target "${{ matrix.target }}"

      - name: Test (cross, qemu)
        if: ${{ matrix.cross }}
        run: cross test --target "${{ matrix.target }}"

      - name: Build
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target "${{ matrix.target }}"

      # The released binary itself, run once each way: --no-report prints the
      # folded text (repeated lines fold, the unique line survives), and the
      # default run saves a report and prints an overview of it.
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/lessence"
          [[ "$TARGET" == *windows* ]] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" --completions bash > /dev/null
          out=$(printf 'ERROR connect timeout host=10.0.0.1\nERROR connect timeout host=10.0.0.2\nERROR connect timeout host=10.0.0.3\nERROR connect timeout host=10.0.0.4\nINFO unique startup line\n' | "$BIN" -q --no-report)
          grep -F "similar" <<<"$out"
          grep -F "INFO unique startup line" <<<"$out"
          reports="$RUNNER_TEMP/lessence-reports"
          out=$(printf 'INFO unique startup line\n' | "$BIN" -q --report-dir "$reports")
          grep -F "report: " <<<"$out"
          find "$reports" -name report.jsonl | grep -q .

      - name: Smoke test (qemu)
        if: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          BIN=/target/aarch64-unknown-linux-gnu/release/lessence
          IMG=ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main
          docker run --rm -v "$PWD/target:/target:Z" "$IMG" qemu-aarch64 "$BIN" --version
          out=$(printf 'ERROR connect timeout host=10.0.0.1\nERROR connect timeout host=10.0.0.2\nERROR connect timeout host=10.0.0.3\nERROR connect timeout host=10.0.0.4\nINFO unique startup line\n' | docker run --rm -i -v "$PWD/target:/target:Z" "$IMG" qemu-aarch64 "$BIN" -q --no-report)
          grep -F "similar" <<<"$out"
          grep -F "INFO unique startup line" <<<"$out"

      # Package exactly as earlier releases did (cargo-binstall reads these
      # names), without uploading: the release job attaches them only once
      # every target has passed.
      - name: Package
        id: package
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lessence
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          zip: windows
          checksum: sha256
          dry-run: true
          dry-run-intended: true

      - name: Keep the package for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lessence-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The notes are the version's CHANGELOG.md section, written by hand
      # before the run. The tag is created here, at the commit every job
      # tested — never before.
      - name: Create the tag and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          previous="$(gh release view --json tagName -q .tagName)"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n**Full changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' \
            "$previous" "$TAG" "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          ls -l dist
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  publish-crate:
    needs: [plan, release]
    if: needs.plan.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # The shipped doc surfaces must match the binary crates.io freezes.
      - name: Doc contract
        run: cargo test --release --test doc_contract

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
