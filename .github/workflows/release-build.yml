name: Release Build

permissions:
  contents: write
  id-token: write

on:
  release:
    # `released` fires when a release is published (a draft promoted to live, or
    # created already-published). Both jobs key off it: publish-crate runs
    # `cargo publish`, build-binaries compiles + attaches the per-target binaries.
    # NOTE: we do NOT use `created` — release-please's bot-created drafts do not
    # emit a `created` workflow event, so binaries must be built at publish time.
    types: [released]
  # Manual recovery: rebuild + reattach binaries for an existing tag (e.g. a
  # release that published without them).
  #   gh workflow run release-build.yml -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build + attach binaries for (e.g. v0.4.3)
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish-crate:
    # Only run when the release is actually published, not on draft creation.
    # crates.io publishes are immutable; we never want to fire this for a
    # draft that might be deleted.
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  build-binaries:
    # Build + attach the per-target binaries when the release is published, or
    # on a manual workflow_dispatch recovery run for a given tag.
    if: github.event.action == 'released' || github.event_name == 'workflow_dispatch'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # mimalloc has C source that needs a musl-targeted C compiler when
      # building for x86_64-unknown-linux-musl. ubuntu-latest doesn't ship
      # musl-tools by default; install it before the upload action runs
      # `cargo build`. No untrusted input is interpolated — `matrix.target`
      # is a static config value, and the run: command is a literal.
      - name: Install musl cross-compile toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lessence
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
