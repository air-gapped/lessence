# cargo-mutants configuration
# Uses the custom [profile.mutants] from Cargo.toml:
# opt-level=1 for faster test execution, debug="none" for faster builds.
profile = "mutants"

# Skip lint checking — mutated code triggers warnings that waste time.
cap_lints = true

# Equivalent mutants: mutations that don't change observable behavior.
# These are structurally impossible to kill — the mutation produces
# identical results due to redundant guards or regex guarantees.
#
# Anchoring: an entry names the mutant by its description and function
# (`... in <fn>$`) when that is unique in the function. Where the function
# holds more than one mutant of the same shape, the entry also pins
# `file:line:col` — such a pin fails safe (after a drift it matches nothing
# and the mutant shows as missed) but must be re-derived with
# `cargo mutants --list --no-config`. Closures in DETECTOR_ORDER have no
# function name, so those entries can only be pinned.
exclude_re = [
    # lessence-e8v: absorb adds two nonempty group counts before this guard.
    # The sum is at least two; checked overflow traps before either guard.
    'replace match guard self\.count > 1 with true in PatternGroup::absorb$',
    '^src/folder/mod\.rs:357:38: replace > with >= in PatternGroup::absorb$',
    # unit_spans emits each PCI match as a whole atom. Its cuts preserve PCI
    # word boundaries, so any isolated match has both start=0 and end=len.
    '^src/folder/mod\.rs:1297:45: replace && with \|\| in varying_spans$',
    # RollupComputer uses positive k (production default 7). At len=k,
    # pop-last, truncate(k-1), push-last is the identity on the sorted vector.
    'replace > with >= in RollupComputer::finalize$',

    # --- 0.4.5 similarity-cache equivalents ---
    # from_normalized: the s.len() > u32::MAX guard needs a > 4 GiB string
    # to distinguish >, >=, == — unconstructible in a test. (`<` makes every
    # line Unbounded and stays testable.)
    'replace > with (==|>=) in SimTokens::from_normalized$',
    # flush_oldest_safe_group: the map entry equal to the removed index is
    # deleted on the line above, so > vs >= over the remaining values is
    # indistinguishable.
    '^src/folder/mod\.rs:2800:23: replace > with >= in PatternFolder::flush_oldest_safe_group$',
    # token_lcs prefix/suffix trims and the early-exit bound are exact
    # optimizations: disabling a trim (< → == / >) or loosening the bound
    # (- → + / /) can never change the returned LCS or decision, only speed.
    '^src/normalize\.rs:1403:17: replace < with (==|>) in Normalizer::token_lcs$',
    '^src/normalize\.rs:1414:17: replace < with (==|>) in Normalizer::token_lcs$',
    '^src/normalize\.rs:1437:42: replace - with \+ in Normalizer::token_lcs$',
    '^src/normalize\.rs:1437:46: replace - with (\+|/) in Normalizer::token_lcs$',
    # are_similar multiset bound: these mutations push the bound above any
    # admissible threshold (<= 100) so the reject never fires — decisions
    # unchanged, only the DP shortcut is lost.
    '^src/normalize\.rs:1493:21: replace \* with \+ in Normalizer::are_similar$',
    '^src/normalize\.rs:1493:66: replace / with \* in Normalizer::are_similar$',
    '^src/normalize\.rs:1493:75: replace \* with \+ in Normalizer::are_similar$',
    # are_similar needed-LCS seed: ceil((T*total)/200) is only a starting
    # point — division by total (>= 2) can only undershoot it, and the
    # step-up loop walks `need` to the same authoritative value. Addition
    # is NOT equivalent at threshold 0; keep that mutant testable. The
    # bounds above need exact locations because their * -> + mutations
    # share a function name with this non-equivalent seed mutation.
    '^src/normalize\.rs:1505:40: replace \* with / in Normalizer::are_similar$',

    # lessence-e8v: widened prefilters only add inert detector calls.
    # cpu_quantities and the bracket detector repeat their own guards;
    # PCI_ADDRESS itself requires both the colon and the dot-digit shape.
    # (The first two are DETECTOR_ORDER closures: pinned, no function name.)
    '^src/normalize\.rs:49:51: replace && with \|\|$',
    '^src/normalize\.rs:149:29: replace && with \|\|$',
    'replace && with \|\| in pci_addresses$',
    # At format_total == 0, nonnegative dominant_count < 0.0 is false
    # regardless of the first guard, so mixed remains false.
    '^src/folder/render\.rs:462:34: replace > with >= in PatternFolder::build_briefing$',

    # --- lessence-e8v: merge_retained's Counted arm is unreachable ---
    # A `Counted` accumulator only exists after `finalize` inserts the
    # VARIES entry, and merge_retained runs before finalize, so the arm
    # that merges two Counted maps never executes: deleting it or changing
    # its `+=` cannot be observed.
    'delete match arm \(Accumulator::Counted\(m\), Accumulator::Counted\(other\)\) in RollupComputer::merge_retained$',
    '^src/folder/mod\.rs:2178:50: replace \+= with .* in RollupComputer::merge_retained$',

    # lessence-e8v: at a mismatch the current LCS cell is max(down, right).
    # down >= max(down, right) and down >= right choose the same branch.
    '^src/folder/mod\.rs:1234:54: replace \+ with \* in align_words$',
    # An opening quote and an option's leading dash cannot occupy the same
    # byte, so option.start() == opening_quote is impossible.
    '^src/folder/mod\.rs:1434:85: replace < with <= in cli_option_units$',

    # --- lessence-e8v: non-folder equivalents, measured MISSED on 4029625
    # (evidence: /var/tmp/lessence-claude-nonfolder/mutants.out) and excluded
    # on the proof written above each entry. Still pending, not excluded:
    # the `||` inside the cpu-quantity prefilter in DETECTOR_ORDER
    # (pipeline-order argument covers probes, not every detector path) and
    # the anchor fold into the line hash in Normalizer::normalize_line
    # (weaker hash mixing is not equivalent behaviour). ---
    # RetainedIndex::candidates is a sound over-approximation: the similarity
    # check runs on every candidate it returns, so a mutant that only widens
    # the length window or scans more postings returns a superset and the
    # output is identical; only cost changes. (84:56 `- with /` can SHRINK the
    # set and stays testable; 68:22 `* with +` makes the range invalid at
    # one token and threshold 100, so it also stays testable.)
    '^src/folder/retained_index\.rs:68:22: replace \* with / in RetainedIndex::candidates$',
    '^src/folder/retained_index\.rs:68:40: replace - with \+ in RetainedIndex::candidates$',
    '^src/folder/retained_index\.rs:72:29: replace \* with \+ in RetainedIndex::candidates$',
    '^src/folder/retained_index\.rs:72:29: replace \* with / in RetainedIndex::candidates$',
    '^src/folder/retained_index\.rs:84:56: replace - with \+ in RetainedIndex::candidates$',

    # cpu_quantities' own prefilter: CPU_QUANTITY needs both the cpu word and
    # the m unit, so widening `||` to `&&` cannot admit or drop a match.
    '^src/patterns/duration\.rs:132:32: replace \|\| with && in DurationDetector::cpu_quantities$',

    # The quoted-string result cache is transparent: the cache-key length cap
    # and the admission bound only decide whether an outcome is memoised.
    'replace <= with > in QuotedStringDetector::detect_and_replace$',
    'replace < with .* in QuotedStringDetector::detect_and_replace$',
    # shape_folded and whole_replacement are set together in every
    # normalize_quoted outcome, so `||` and `&&` agree.
    'replace \|\| with && in QuotedStringDetector::detect_and_replace$',

    # is_prose runs only after is_likely_id, which requires a digit, while
    # is_prose requires an all-alphabetic id: it can never be true.
    'replace UuidDetector::is_prose -> bool with false$',
    'replace - with / in UuidDetector::is_prose$',

    # With last == 0 the `>=` branch assigns text[0..] back to text, byte for byte.
    'replace > with >= in KeyValueDetector::apply_general_pattern$',
]
