[advisories]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The one wildcard allowed: the self dev-dependency in Cargo.toml that turns
# on the `test-hooks` feature for `cargo test` and for no other build. It is
# a path dependency on this crate, not a registry dependency with an
# unpinned version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
