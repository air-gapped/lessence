# Nextest configuration for lessence
#
# Timing-sensitive tests (ReDoS scaling, performance comparisons) run
# in a serial group to eliminate CPU contention flakes. All other tests
# run in parallel as usual.
#
# Retries: timing tests retry up to 2 times on failure. Noise-induced
# flakes pass on retry; genuine O(n²) regressions fail all 3 attempts.
# Exponential backoff lets CPU settle between retries.

[test-groups.serial-timing]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(redos) | test(scales_linearly) | test(performance) | test(timeout) | test(allocation_consistency) | test(backward_compatibility) | test(unix_timestamp_penalty)'
test-group = 'serial-timing'
retries = { count = 2, backoff = "exponential", delay = "500ms", max-delay = "5s" }

# Three kinds of test leave the default profile for `slow`, which
# `make release-check` runs alone:   cargo nextest run --release --profile slow
#
#  - The wall-clock tests: every `*scales_linearly*` test, the kubelet
#    speed requirement, and the tests that assert on elapsed time or a
#    timing ratio without carrying that name (listed by name below:
#    test_detection_performance, security_compliance, the email
#    performance check, the validation fail-fast check). A duration is not
#    evidence (CLAUDE.md) and flakes under load.
#  - `overview_all_streams_two_hundred_thousand_groups_*`: its point is a
#    memory cap (the systemd-run invocation is in its doc comment), which no
#    profile imposes; uncapped it proves only that --overview all completes
#    on 200,000 groups. About 0.5 s, measured 2026-11-10.
#  - `every_order_dependence_on_a_corpus_line_is_declared`: every corpus
#    line under every pair of detectors in both orders, about 170 passes
#    over the corpora. The per-commit suite proves each declared rule on
#    its own line; this one finds the rules nobody declared.
[profile.default]
default-filter = "not (test(scales_linearly) | test(test_processing_speed_requirement) | test(test_long_text_performance) | test(test_overlap_resolution_performance) | test(test_no_match_performance) | test(test_pattern_priority_performance) | test(test_backward_compatibility_performance) | test(test_unix_timestamp_penalty_performance) | test(test_memory_allocation_consistency) | test(test_scalability_with_pattern_count) | test(test_redos_protection_email) | test(test_redos_protection_timestamp) | test(test_redos_protection_ipv6) | test(test_security_performance_overhead) | test(test_email_performance_impact) | test(test_validation_fails_fast_no_stdin_read) | test(overview_all_streams_two_hundred_thousand_groups) | test(every_order_dependence_on_a_corpus_line_is_declared))"

[profile.slow]
default-filter = "test(scales_linearly) | test(test_processing_speed_requirement) | test(test_long_text_performance) | test(test_overlap_resolution_performance) | test(test_no_match_performance) | test(test_pattern_priority_performance) | test(test_backward_compatibility_performance) | test(test_unix_timestamp_penalty_performance) | test(test_memory_allocation_consistency) | test(test_scalability_with_pattern_count) | test(test_redos_protection_email) | test(test_redos_protection_timestamp) | test(test_redos_protection_ipv6) | test(test_security_performance_overhead) | test(test_email_performance_impact) | test(test_validation_fails_fast_no_stdin_read) | test(overview_all_streams_two_hundred_thousand_groups) | test(every_order_dependence_on_a_corpus_line_is_declared)"
