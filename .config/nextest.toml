# Nextest configuration for lessence
#
# Timing-sensitive tests (ReDoS scaling, performance comparisons) run
# in a serial group to eliminate CPU contention flakes. All other tests
# run in parallel as usual.
#
# Retries: timing tests retry up to 2 times on failure. Noise-induced
# flakes pass on retry; genuine O(n²) regressions fail all 3 attempts.
# Exponential backoff lets CPU settle between retries.

[test-groups.serial-timing]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(redos) | test(scales_linearly) | test(performance) | test(timeout) | test(allocation_consistency) | test(backward_compatibility) | test(unix_timestamp_penalty)'
test-group = 'serial-timing'
retries = { count = 2, backoff = "exponential", delay = "500ms", max-delay = "5s" }

# Two kinds of test leave the default profile for `slow`, which
# `make release-check` runs alone:   cargo nextest run --release --profile slow
#
#  - The wall-clock tests: every `*scales_linearly*` test and the kubelet
#    speed requirement. A duration is not evidence (CLAUDE.md) and flakes
#    under load.
#  - `a_write_failure_mid_spool*`. Its assertions are sound and its fixture
#    is not padding: the report only spools mid-ingest once a run passes
#    RETAINED_TEMPLATE_CAP, so the failure path it proves does not happen
#    below 16,384 groups (measured: 16,000 lines does not trigger it).
#    Folding that many distinct groups is quadratic - 2k/4k/8k/16k lines
#    measure 0.11/0.41/1.62/7.03 s - so the test costs about 8 s, which was
#    60% of the whole per-commit suite. It runs before every release
#    instead. The same write-failure reporting is covered per-commit by
#    `a_failure_writing_the_summary_record_never_claims_a_complete_report`
#    on a small fixture.
[profile.default]
default-filter = "not (test(scales_linearly) | test(test_processing_speed_requirement) | test(a_write_failure_mid_spool))"

[profile.slow]
default-filter = "test(scales_linearly) | test(test_processing_speed_requirement) | test(a_write_failure_mid_spool)"
